name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: List Files
      run: |
        echo "=== Files in Repository ==="
        ls -la
        echo "=== Unzipping ==="
        unzip -o "*.zip" -d extracted_app || true
        echo "=== Searching for gradlew ==="
        find . -name "gradlew"

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "ERROR: gradlew file not found anywhere in the ZIP!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/app-debug.apk"
