name: Build Android APK from Web App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP and Build Web
      run: |
        unzip -o "*.zip" -d extracted_app
        PROJECT_DIR=$(find extracted_app -name "package.json" -exec dirname {} \;)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        cd "$PROJECT_DIR"
        npm install
        npm run build || npx vite build || true
        
        # ساخت پوشه خروجی در صورت عدم وجود
        mkdir -p dist
        if [ -d "build" ]; then cp -r build/* dist/ 2>/dev/null || true; fi
        if [ -d "public" ]; then cp -r public/* dist/ 2>/dev/null || true; fi

    - name: Generate Android Project & Build APK
      run: |
        cd "$PROJECT_DIR"
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "StreetFighter" "com.streetfighter.irani" --web-dir dist
        npx cap add android
        npx cap sync android
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
