name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP and Build Web Project
      run: |
        unzip -o "*.zip" -d extracted_app
        PROJECT_DIR=$(find extracted_app -name "package.json" -exec dirname {} \;)
        cd "$PROJECT_DIR"
        npm install --legacy-peer-deps
        npm run build || npx vite build

    - name: Initialize Capacitor and Build APK
      run: |
        PROJECT_DIR=$(find extracted_app -name "package.json" -exec dirname {} \;)
        cd "$PROJECT_DIR"
        
        # تشخیص پوشه خروجی
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        
        npx @capacitor/cli init "Street Fighter" "com.streetfighter.irani" --web-dir "$WEB_DIR"
        npm install @capacitor/core @capacitor/android
        npx @capacitor/cli add android
        npx @capacitor/cli sync android
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
