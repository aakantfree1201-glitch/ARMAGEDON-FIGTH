name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract ZIP file
      run: |
        unzip -o "*.zip"
        find . -maxdepth 2 -type d -name "android" | xargs -I {} cp -r {}/. ./android/ 2>/dev/null || true

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        if [ -d "android" ]; then cd android; fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/app-debug.apk"
