name: Build Android APK via Cordova

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Cordova and Build Web App
      run: |
        npm install -g cordova
        unzip -o "*.zip" -d extracted_app
        PROJECT_DIR=$(find extracted_app -name "package.json" -exec dirname {} \;)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        cd "$PROJECT_DIR"
        npm install
        npm run build || npx vite build || true
        
        # مشخص کردن پوشه خروجی وب
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        if [ -d "public" ]; then WEB_DIR="public"; fi
        
        # ساخت پروژه کلاغ اندروید
        cd "$GITHUB_WORKSPACE"
        cordova create cordova_app com.streetfighter.irani StreetFighter
        cd cordova_app
        rm -rf www/*
        cp -r "$GITHUB_WORKSPACE/$PROJECT_DIR/$WEB_DIR/"* www/
        cordova platform add android
        cordova build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/platforms/android/app/build/outputs/apk/debug/*.apk"
