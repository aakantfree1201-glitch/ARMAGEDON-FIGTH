name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract and Show All Files
      run: |
        unzip -o "*.zip" -d extracted_app || true
        echo "=================== ALL FILES IN ZIP ==================="
        find . -maxdepth 3
