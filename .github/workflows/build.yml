name: Build Android APK from Web App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP and Build Web Assets
      run: |
        unzip -o "*.zip" -d extracted_app
        PROJECT_DIR=$(find extracted_app -name "package.json" -exec dirname {} \;)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        cd "$PROJECT_DIR"
        npm install
        npm run build || npx vite build || true
        
        # پیدا کردن هوشمند پوشه خروجی وب
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        if [ -d "public" ]; then WEB_DIR="public"; fi
        echo "WEB_DIR=$WEB_DIR" >> $GITHUB_ENV

    - name: Setup Capacitor and Android Platform
      run: |
        cd "$PROJECT_DIR"
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Street Fighter Irani" "com.streetfighter.irani" --web-dir "$WEB_DIR" || true
        npx cap add android || true
        npx cap copy android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd "$PROJECT_DIR/android"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
